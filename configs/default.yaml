env:
  train_depth_range: [3, 6]
  max_depth: 9
  p_fault: 0.80
  budget_extra: 6
  fault_profile: middle
  fault_peak_weight: 5.0
  use_risk_hints: true
  hint_reliability: 0.85
  hint_false_positive: 0.15
  verify_cost: 1
  revise_cost: 1
  think_cost: 1
  correct_reward: 1.0
  incorrect_reward: -1.2
  invalid_action_penalty: 0.10
  step_penalty: 0.04
  cost_adjust_weight: 0.05
  naive_progress_bonus: 0.015
  naive_verify_bonus: 0.02
  ma_safe_verify_bonus: 0.02
  ma_fault_verify_bonus: 0.25
  ma_waste_verify_penalty: 0.06
  ma_opaque_penalty: 0.30
  ma_hint_verify_bonus: 0.18
  ma_low_hint_penalty: 0.02

rl_variants:
  - name: rl_outcome
    display_name: Outcome-only RL
    env_overrides:
      reward_scheme: outcome_only
  - name: rl_naive_process
    display_name: Naive Process RL
    env_overrides:
      reward_scheme: naive_process
  - name: rl_monitorability
    display_name: Monitorability-aware RL
    env_overrides:
      reward_scheme: monitorability_aware

training:
  seeds: [0, 1, 2, 3, 4]
  smoke_seeds: [0]
  episodes: 5000
  smoke_episodes: 1200
  gamma: 0.99
  learning_rate: 0.001
  hidden_size: 64
  replay_size: 25000
  batch_size: 64
  warmup_steps: 500
  updates_per_step: 1
  target_update_interval: 200
  epsilon_start: 0.50
  epsilon_end: 0.02
  epsilon_decay_fraction: 0.85
  log_interval: 200
  prefer_mps: true

evaluation:
  episodes_per_seed: 300
  smoke_episodes_per_seed: 64
  settings:
    - name: train_like
      depth_range: [3, 6]
    - name: heldout_long
      depth_range: [7, 9]
    - name: fault_low
      depth_range: [7, 9]
      p_fault: 0.60
    - name: fault_high
      depth_range: [7, 9]
      p_fault: 0.90
    - name: verify_cost_1
      depth_range: [7, 9]
      verify_cost: 1
    - name: verify_cost_2
      depth_range: [7, 9]
      verify_cost: 2
    - name: verify_cost_3
      depth_range: [7, 9]
      verify_cost: 3
    - name: budget_extra_4
      depth_range: [7, 9]
      budget_extra: 4
    - name: budget_extra_6
      depth_range: [7, 9]
      budget_extra: 6
    - name: budget_extra_8
      depth_range: [7, 9]
      budget_extra: 8
    - name: cue_clean
      depth_range: [7, 9]
      hint_reliability: 0.95
      hint_false_positive: 0.05
    - name: cue_noisy
      depth_range: [7, 9]
      hint_reliability: 0.60
      hint_false_positive: 0.35
